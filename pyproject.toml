[project]
name = "devcrew"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "boto3>=1.43.72",
    "claude-agent-sdk>=0.2.139",
    "openai-codex>=0.144.4",
    "slack-bolt>=1.30.0",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
