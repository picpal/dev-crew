# §17 — tier = (full model ID, 기본 effort) 쌍. alias 금지 (#12)
tiers:
  HAIKU_FAST:           { provider: CLAUDE_CODE, model: claude-haiku-4-5-20251001, effort: LOW }
  CHEAP:                { provider: CLAUDE_CODE, model: claude-sonnet-5, effort: LOW }
  DEFAULT:              { provider: CLAUDE_CODE, model: claude-sonnet-5, effort: HIGH }
  HIGH_CAPABILITY:      { provider: CLAUDE_CODE, model: claude-opus-5,   effort: HIGH }
  CODEX_DEFAULT:        { provider: CODEX,       model: gpt-5.6-terra,   effort: MEDIUM }
  CODEX_HIGH_REASONING: { provider: CODEX,       model: gpt-5.6-sol,     effort: HIGH }

roleDefaults:
  ORCHESTRATOR: { tier: HIGH_CAPABILITY }
  EXPLORER:  { tier: CHEAP }   # sonnet 유지 (사용자 정정)
  ARCHITECT: { tier: HIGH_CAPABILITY }
  DEVELOPER: { tier: DEFAULT }
  SECURITY:  { tier: HIGH_CAPABILITY }
  QA:        { tier: CHEAP }   # sonnet 유지 (사용자 정정)
  REVIEWER:  { tier: CODEX_HIGH_REASONING }  # gpt-5.6-sol
  BRAIN:     { tier: HIGH_CAPABILITY, effort: XHIGH }  # opus + 최대 검토 품질 (사용자 결정 2026-08-19)

# §10.3 loop guard — Task 실패가 아니라 결정 지점 진입 조건
loopPolicy:
  maxIterations: 5
  maxDurationMinutes: 60
  maxTokenBudget: 300000
  sameFindingEscalationThreshold: 3
